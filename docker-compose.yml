version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: smartpong-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: smartpong-backend
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    container_name: smartpong-frontend
    ports:
      - "5173:80" # Mapping 5173 on the host (like Vite dev server) to 80 in the container
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  mongodb_data:
