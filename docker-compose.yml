version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: smartpong-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: smartpong-mosquitto
    ports:
      - "1883:1883"   # MQTT (firmware + backend)
      - "9101:9001"   # MQTT over WebSocket (browser/frontend); host 9101 -> container 9001
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: smartpong-backend
    ports:
      - "8000:8000"
    environment:
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
    restart: unless-stopped
    depends_on:
      - mongodb
      - mosquitto

  frontend:
    build: ./frontend
    container_name: smartpong-frontend
    ports:
      - "5173:80" # Mapping 5173 on the host (like Vite dev server) to 80 in the container
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  mongodb_data:
